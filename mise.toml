# Tool manifest for the Emacs IDE.  Installed into the sandbox by
# `M-x ide-mise-setup' (or `make tools'); state never leaves var/mise/.
# Portable: any machine with mise (or network access to fetch it) gets the same tools.

[tools]
# Runtimes
python = "3.13"
node   = "lts"
go     = "latest"
uv     = "latest"

# Search / editor helpers
ripgrep = "latest"
fd      = "latest"
jq      = "latest"
pandoc  = "latest"
direnv  = "latest"

# Cloud and DevOps CLIs
"pypi:azure-cli" = "latest"
kubectl          = "latest"
helm             = "latest"
terraform        = "latest"
packer           = "latest"
"pypi:ansible-core" = "latest"
"pypi:ansible-lint" = "latest"   # run by ansible-language-server for diagnostics

# Language servers and debuggers
ruff                                    = "latest"
"npm:pyright"                           = "latest"
"npm:yaml-language-server"              = "latest"
"npm:bash-language-server"              = "latest"
"npm:dockerfile-language-server-nodejs" = "latest"
"npm:@ansible/ansible-language-server"  = "latest"
terraform-ls                            = "latest"
"go:golang.org/x/tools/gopls"           = "latest"
"go:github.com/go-delve/delve/cmd/dlv"  = "latest"

# Rust (rustup-managed inside the sandbox) and TOML
rust   = { version = "stable", profile = "minimal", components = "rust-analyzer,clippy,rustfmt,rust-src" }
"aqua:nextest-rs/nextest/cargo-nextest" = "latest"
taplo  = "latest"
"cargo:evcxr_repl" = "latest"

# Web: TypeScript / JavaScript / HTML / CSS
"npm:typescript"                    = "latest"
"npm:typescript-language-server"    = "latest"
"npm:vscode-langservers-extracted"  = "latest"
"npm:prettier"                      = "latest"
"npm:eslint"                        = "latest"
"npm:tsx"                           = "latest"

# Lua
lua-language-server = "latest"
stylua              = "latest"

# PowerShell
powershell = "latest"

# DevOps: Kubernetes / Helm, linters and scanners
helm-ls      = "latest"
kubeconform  = "latest"
kind         = "latest"   # throwaway local clusters in Docker, for testing kubectl / Helm
kube-linter  = "latest"
shellcheck   = "latest"
shfmt        = "latest"
hadolint     = "latest"
tflint       = "latest"
actionlint   = "latest"
trivy        = "latest"
"pypi:yamllint"         = "latest"
marksman             = "latest"
"npm:markdownlint-cli2" = "latest"
